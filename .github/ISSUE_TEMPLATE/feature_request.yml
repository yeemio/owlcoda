name: Feature request
description: Suggest an OwlCoda improvement.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would a good solution look like?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: OS, terminal, model provider, or other relevant setup.
  - type: dropdown
    id: product_boundary
    attributes:
      label: Product boundary
      options:
        - Current public Runtime/Harness
        - Business execution semantics or product surface
        - Replaceable executor integration
        - OwlRunKit delivery continuity (please use the OwlRunKit repository)
        - Unsure
    validations:
      required: true
