name: CI

on:
  push:
    branches:
      - main
  pull_request:

# One run per ref; cancel stale runs to avoid wasting hosted capacity.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout (clean)
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      # 1. Clean install from lockfile.
      - name: Install
        run: npm ci

      # 2. Typecheck.
      - name: Typecheck
        run: npx tsc --noEmit

      # 3. Build (produces dist/, needed by the integration tests below).
      - name: Build
        run: npm run build

      # 4. Stale-binary SHA gate (F8). Assert the just-built binary baked the
      #    current HEAD SHA, so an old dist/ can never masquerade as new code
      #    (the "--version says it's old code" dogfood class). The version.ts
      #    classifier is unit-tested as fitness cell build.stale_binary.
      - name: Stale-binary SHA gate
        shell: bash
        run: |
          set -euo pipefail
          built="$(node dist/cli.js --version 2>&1 | sed -n 's/.*build: \([0-9a-f][0-9a-f]*\).*/\1/p')"
          head7="$(git rev-parse HEAD)"; head7="${head7:0:7}"
          echo "binary build SHA: ${built:-<none>} · HEAD: ${head7}"
          if [ -z "$built" ]; then
            echo "::error::--version did not report a build SHA (build-info.json missing?)"
            exit 1
          fi
          if [ "$built" != "$head7" ]; then
            echo "::error::stale binary: --version reports ${built} but HEAD is ${head7}"
            exit 1
          fi

      # 5. Imported-but-untracked guard (build.imported_untracked). Catch a
      #    tracked file importing a module that was never git-added — invisible
      #    on a dirty tree (file on disk) but fatal to a clean clone / tarball
      #    (the 0.14.53 "断头 HEAD" class). Reuses the built, unit-tested kernel.
      - name: Imported-untracked guard
        run: node scripts/check-imported-untracked.mjs

      # 6. Ink side-channel write boundary (arch.ink_write_boundary). Forbid a
      #    React effect hook from writing to the terminal directly — every write
      #    must route through the buffered render Diff. Scoped to effect-hook
      #    bodies via the TS AST so the ~35 legit renderer writes are untouched.
      #    Baseline is clean (0 violations) so --enforce blocks only regressions.
      - name: Ink write-boundary lint
        run: node scripts/ink-write-boundary.mjs --enforce

      # 7. Full test suite. MUST run after build: several integration tests
      #    import from ../dist/runtime/*, so a pre-build run is a false negative.
      - name: Test
        run: npm test

      # 8. Clean-checkout build. Build once more from a fresh clone in a temp
      #    dir to prove the candidate does not depend on checkout residue. This is
      #    the automated form of the
      #    "release must build from a clean checkout" hygiene rule.
      - name: Clean-checkout build
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --no-local "$GITHUB_WORKSPACE" "$tmp"
          cd "$tmp"
          npm ci
          npm run build

      # 9. Startup / basic-path smoke.
      - name: Smoke
        run: npm run smoke

      # 10. Release smoke (the actual pre-publish gate; also run by prepublishOnly).
      - name: Release smoke
        run: npm run release:smoke
